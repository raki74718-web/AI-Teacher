<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Teacher | B.Tech</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#183153;color:#fff;text-align:center;padding:25px}
header h1{margin:0 0 7px}
header p{margin:0;opacity:.85}
main{max-width:820px;margin:35px auto;padding:0 18px}
.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0001}
label{display:block;font-weight:700;margin:14px 0 8px}
select,textarea{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
textarea{min-height:140px;resize:vertical}
button{margin-top:16px;padding:13px 20px;border:0;border-radius:10px;background:#183153;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#status{color:#596579}
#answer{margin-top:20px;padding:18px;border:1px solid #dde3ed;background:#f8fafc;border-radius:12px;white-space:pre-wrap;line-height:1.65;min-height:110px}
</style>
</head>

<body>

<header>
<h1>AI Teacher</h1>
<p>Ask questions from your B.Tech subject book</p>
</header>

<main>
<div class="card">

<label>Select Subject</label>
<select id="subject">
<option>Loading subjects...</option>
</select>

<label>Your Question</label>
<textarea id="question" placeholder="Example: Explain this topic in simple terms."></textarea>

<button id="ask">Ask AI Teacher</button>

<p id="status"></p>

<div id="answer">
Your answer will appear here.
</div>

</div>
</main>

<script>

const subject = document.getElementById('subject');
const question = document.getElementById('question');
const ask = document.getElementById('ask');
const status = document.getElementById('status');
const answer = document.getElementById('answer');

async function load() {

  try {

    const r = await fetch(
      'https://ai-teacher-backend-6htm.onrender.com/api/subjects'
    );

    const d = await r.json();

    subject.innerHTML =
      '<option value="">-- Select Subject --</option>';

    d.forEach(s => {

      const o = document.createElement('option');

      o.value = s.id;
      o.textContent = s.name;

      subject.appendChild(o);

    });

    if (!d.length) {

      subject.innerHTML =
        '<option value="">No subjects added yet</option>';

    }

  } catch {

    subject.innerHTML =
      '<option>Could not load subjects</option>';

  }

}


ask.onclick = async () => {

  if (!subject.value || !question.value.trim()) {

    status.textContent =
      'Please select a subject and enter a question.';

    return;

  }

  ask.disabled = true;

  status.textContent =
    'AI Teacher is reading the saved book...';

  answer.textContent = '';

  try {

    const r = await fetch(
      'https://ai-teacher-backend-6htm.onrender.com/api/ask',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          subjectId: subject.value,
          question: question.value
        })
      }
    );

    const d = await r.json();

    if (!r.ok) {

      throw Error(
        d.error || 'Request failed'
      );

    }

    answer.textContent = d.answer;

    status.textContent = 'Done.';

  } catch (e) {

    answer.textContent =
      'Error: ' + e.message;

    status.textContent = '';

  } finally {

    ask.disabled = false;

  }

};


load();

</script>

</body>
</html>
